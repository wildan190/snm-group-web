<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynamic Content CMS</title>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
  .header { background-color: #2c3e50; color: #fff; padding: 20px; text-align: center; }
  .content { padding: 40px; display: flex; justify-content: space-evenly; flex-wrap: wrap; text-align: center; height: 100vh; flex-direction: column; }
  .card-style { width: 15rem; min-height: 15rem; background: white; margin: 10px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); display: flex; align-items: center; justify-content: center; flex-direction: column; padding: 20px; transition: transform 0.3s ease; border: 1px solid #e0e0e0; }
  .card-style:hover { transform: translateY(-5px); border-color: #3498db; }
  .card-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 10px; color: #333; }
  .card-description { font-size: 1rem; color: #666; }
</style>
</head>
<body>

<div class="content">
  <div class="card-style">
    <div class="card-title">Manage Pages</div>
    <div class="card-description">Create, edit, and manage your dynamic pages easily.</div>
  </div>
  <div class="card-style">
    <div class="card-title">Assets Manager</div>
    <div class="card-description">Upload and organize your media assets efficiently.</div>
  </div>
  <div class="card-style">
    <div class="card-title">Settings</div>
    <div class="card-description">Configure your CMS settings according to your needs.</div>
  </div>
</div>

<div id="content_content" class="content-content">Content for dynamic content goes here</div>

<script>
  function fetchContent() {
    const url = "https://script.google.com/macros/s/AKfycbz_KqW0G_it4J2W8dOkRk7Z6S78_0tY7y9U8xQ6V6O-m-V9f9W9/exec"; // Update with actual apps script url
    const contentPlaceholder = document.getElementById("content_content");

    fetch(url)
      .then(response => response.text())
      .then(data => {
        contentPlaceholder.innerHTML = data;
      })
      .catch(error => {
        console.error('Error fetching dynamic content:', error);
        contentPlaceholder.textContent = "Failed to load content.";
      });
  }

  fetchContent();
</script>
</body>
</html>
